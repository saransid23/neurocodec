# NeuroCodec Default Configuration
# 16 kHz Mono High-Fidelity Speech Neural Audio Codec

audio:
  sample_rate: 16000
  channels: 1
  segment_length: 16000  # 1.0 second per segment
  normalize: true

model:
  encoder:
    in_channels: 1
    hidden_dim: 64
    latent_dim: 512
    strides: [2, 4, 5, 8]  # Downsampling factor = 320 (50 fps @ 16kHz)
    kernel_sizes: [3, 7]
    dilations: [1, 3, 9]

  rvq:
    num_quantizers: 8
    codebook_size: 1024
    codebook_dim: 512
    commitment_weight: 0.25
    quantizer_dropout: 0.2  # Training dropout to make lower layers strong

  importance_net:
    input_dim: 512
    hidden_dim: 256
    num_layers: 2
    min_quantizers: 1
    max_quantizers: 8
    threshold: 0.5
    bitrate_target_kbps: 3.0  # Optional target for regularized bitrate

  decoder:
    out_channels: 1
    latent_dim: 512
    hidden_dim: 512
    strides: [8, 5, 4, 2]  # Symmetric upsampling
    kernel_sizes: [3, 7]
    dilations: [1, 3, 9]

discriminators:
  multi_period:
    periods: [2, 3, 5, 7, 11]
    channels: [32, 64, 128, 256, 512]
  multi_scale:
    scales: [1, 2, 4]

losses:
  weights:
    reconstruction_stft: 1.0
    reconstruction_mel: 1.0
    reconstruction_time: 0.1
    adversarial_gen: 1.0
    feature_matching: 2.0
    rvq_commitment: 0.25
    rvq_codebook: 1.0
    bitrate_regularization: 0.05
    semantic: 0.5
  stft:
    n_ffts: [2048, 1024, 512]
    hop_lengths: [512, 256, 128]
    win_lengths: [2048, 1024, 512]
  semantic:
    model_name: "facebook/w2v-bert-2.0"
    load_pretrained_hf: false  # Set to true to download 2.4GB w2v-bert-2.0 checkpoint
    layer_indices: [-1, -4]
    enable_cache: true
    allow_mock_fallback: true

noise:
  enabled: true
  prob: 0.7
  snr_min_db: 5.0
  snr_max_db: 25.0
  noise_types: ["gaussian", "pink", "babble", "reverb"]

training:
  batch_size: 4
  num_workers: 0
  grad_accum_steps: 4
  learning_rate_g: 0.0002
  learning_rate_d: 0.0002
  betas: [0.8, 0.99]
  weight_decay: 0.01
  epochs: 50
  save_checkpoint_interval: 1
  tensorboard_log_interval: 10
  checkpoint_dir: "checkpoints"
  log_dir: "runs/neurocodec"
  device: "cpu"  # Set to "cuda" if GPU is available
